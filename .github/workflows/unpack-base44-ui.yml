name: Materialize Base44 UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded Base44 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .base44_extract
          mkdir .base44_extract

          # Use the complete Base44 export uploaded to the repository.
          ZIP="Bloxy-bot-ai.zip"
          if [ ! -s "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1 || true)"
          fi
          test -n "$ZIP"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -q -o "$ZIP" -d .base44_extract

          # Base44 exports can either contain one top-level project folder
          # or place the exported files directly at the ZIP root.
          mapfile -t dirs < <(find .base44_extract -mindepth 1 -maxdepth 1 -type d -print)
          if [ "${#dirs[@]}" -eq 1 ]; then
            project_dir="${dirs[0]}"
          else
            project_dir=".base44_extract"
          fi

          # Preserve the working backend/deployment files already in main.
          for f in app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py requirements.txt render.yaml .env.example .gitignore; do
            if [ -f "$f" ]; then cp "$f" ".base44_extract/.$(basename "$f").preserve"; fi
          done

          cp -a "$project_dir/." .

          for f in app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py requirements.txt render.yaml .env.example .gitignore; do
            preserved=".base44_extract/.$(basename "$f").preserve"
            if [ -f "$preserved" ]; then cp "$preserved" "$f"; fi
          done

          rm -rf .base44_extract

      - name: Configure frontend bridge
        shell: bash
        run: |
          if [ -f src/lib/bloxyEngine.js ]; then
            python - <<'PY'
            from pathlib import Path
            p = Path('src/lib/bloxyEngine.js')
            s = p.read_text()
            s = s.replace("const DEFAULT_NEXUS_URL = 'https://bloxy-nexus.onrender.com';", "const DEFAULT_NEXUS_URL = '/';")
            p.write_text(s)
            PY
          fi

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes needed."
            exit 0
          fi
          git commit -m "Materialize complete Base44 source into main"
          git push
