name: Materialize Base44 UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded Base44 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .base44_extract
          mkdir .base44_extract
          test -s Bloxy-bot-ai.zip
          unzip -q Bloxy-bot-ai.zip -d .base44_extract
          project_dir="$(find .base44_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$project_dir" ]; then
            project_dir=.base44_extract
          fi

          # Preserve the existing Bloxy backend/setup files while materializing
          # the Base44 application source around them.
          for f in app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py requirements.txt render.yaml .env.example .gitignore; do
            if [ -f "$f" ]; then cp "$f" ".base44_extract/.$(basename "$f").preserve"; fi
          done

          cp -a "$project_dir/." .

          for f in app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py requirements.txt render.yaml .env.example .gitignore; do
            preserved=".base44_extract/.$(basename "$f").preserve"
            if [ -f "$preserved" ]; then cp "$preserved" "$f"; fi
          done

          rm -rf .base44_extract Bloxy-bot-ai.zip base44-ui-source.zip

      - name: Write Render Blueprint
        shell: bash
        run: |
          cat > render.yaml <<'YAML'
          services:
            - type: web
              name: bloxy-nexus
              runtime: python
              plan: free
              rootDir: backend
              buildCommand: pip install -r requirements.txt
              startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
              healthCheckPath: /health
              envVars:
                - key: PYTHON_VERSION
                  value: 3.11.9
                - key: FRONTEND_ORIGIN
                  value: https://bloxy-bot-ui.onrender.com
                - key: BASE44_ORIGIN
                  sync: false
                - key: SECRET_KEY
                  sync: false

            - type: static_site
              name: bloxy-bot-ui
              buildCommand: npm install && npm run build
              staticPublishPath: dist
              envVars:
                - key: VITE_BLOXY_NEXUS_URL
                  value: https://bloxy-nexus.onrender.com
          YAML

      - name: Make frontend bridge same-origin configurable
        shell: bash
        run: |
          if [ -f src/lib/bloxyEngine.js ]; then
            python - <<'PY'
            from pathlib import Path
            p = Path('src/lib/bloxyEngine.js')
            s = p.read_text()
            s = s.replace("const DEFAULT_NEXUS_URL = 'https://bloxy-nexus.onrender.com';", "const DEFAULT_NEXUS_URL = '/';")
            p.write_text(s)
            PY
          fi

      - name: Validate backend syntax
        run: |
          if compgen -G 'backend/*.py' > /dev/null; then python -m py_compile backend/*.py; fi
          python -m py_compile app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py

      - name: Show final file count
        shell: bash
        run: |
          COUNT=$(git ls-files | wc -l)
          echo "Final repository file count: $COUNT"
          test "$COUNT" -ge 120

      - name: Commit materialized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Materialize complete Base44 source and deployment setup"
          git push
