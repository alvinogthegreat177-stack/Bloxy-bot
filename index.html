<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('bloxy_theme');
          var theme = raw ? JSON.parse(raw) : 'dark';
          if (theme !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
