services:
  - type: web
    name: bloxy-nexus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BASE44_ORIGIN
        sync: false
      - key: SECRET_KEY
        sync: false
