name: Materialize Base44 UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded Base44 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .base44_extract
          mkdir .base44_extract
          test -s Bloxy-bot-ai.zip
          unzip -q -o Bloxy-bot-ai.zip -d .base44_extract

          # Base44 exports can either contain one top-level project folder
          # or place the exported files directly at the ZIP root.
          mapfile -t dirs < <(find .base44_extract -mindepth 1 -maxdepth 1 -type d -print)
          if [ "${#dirs[@]}" -eq 1 ]; then
            project_dir="${dirs[0]}"
          else
            project_dir=".base44_extract"
          fi

          # Preserve the working backend/deployment files supplied in this repo.
          for f in app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py requirements.txt render.yaml .env.example .gitignore; do
            if [ -f "$f" ]; then cp "$f" ".base44_extract/.$(basename "$f").preserve"; fi
          done

          cp -a "$project_dir/." .

          for f in app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py requirements.txt render.yaml .env.example .gitignore; do
            preserved=".base44_extract/.$(basename "$f").preserve"
            if [ -f "$preserved" ]; then cp "$preserved" "$f"; fi
          done

          rm -rf .base44_extract

      - name: Make frontend bridge same-origin configurable
        shell: bash
        run: |
          if [ -f src/lib/bloxyEngine.js ]; then
            python - <<'PY'
            from pathlib import Path
            p = Path('src/lib/bloxyEngine.js')
            s = p.read_text()
            s = s.replace("const DEFAULT_NEXUS_URL = 'https://bloxy-nexus.onrender.com';", "const DEFAULT_NEXUS_URL = '/';")
            p.write_text(s)
            PY
          fi

      - name: Validate backend syntax
        run: |
          python -m py_compile app.py ai_engine.py nexus.py provider_health.py providers.py schemas.py utils.py
          if compgen -G 'backend/*.py' > /dev/null; then python -m py_compile backend/*.py; fi

      - name: Validate materialized source count
        shell: bash
        run: |
          COUNT=$(find . -type f -not -path './.git/*' -not -path './.base44_extract/*' | wc -l)
          echo "Final working-tree file count: $COUNT"
          test "$COUNT" -ge 120

      - name: Commit materialized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Materialize complete Base44 source and deployment setup"
          git push

# Trigger materialization after the uploaded ZIP is present on main.
